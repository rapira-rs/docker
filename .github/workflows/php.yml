# Builds the PHP images when php-src tags a patch release, when a generated Dockerfile changes on main, and one time each week for package fixes.
# The state is on the images: the annotations of ghcr.io/<owner>/php:<minor>-nts.
name: PHP images
on:
    schedule:
        # GitHub delays or drops scheduled runs under high load, for example at the start of each hour: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
        - cron: "7,22,37,52 * * * *"
        # The activity job.
        - cron: "41 6 * * 1"
    push:
        branches: [main]
        paths: ["8.*/**", "docker-php-*", "LICENSE.docker-library"]
    workflow_dispatch:
        inputs:
            force:
                description: "Build the images of all minors again"
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: php-images
    cancel-in-progress: false

env:
    PHP_IMAGE: ghcr.io/${{ github.repository_owner }}/php

jobs:
    activity:
        # GitHub disables the schedule of a public repository after 60 days without repository activity: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
        if: github.event.schedule == '41 6 * * 1'
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        steps:
            - shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  LAST=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .commit.committer.date)
                  AGE=$(( ($(date +%s) - $(date -d "$LAST" +%s)) / 86400 ))
                  echo "The newest commit on $GITHUB_REF_NAME is $AGE days old ($LAST)."
                  if [ "$AGE" -ge 45 ]; then
                      echo "::error::No commit on $GITHUB_REF_NAME for $AGE days. GitHub disables the schedule of this workflow at 60 days. Merge a pull request or push a commit before that day."
                      exit 1
                  fi

    php-check:
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
            packages: read
        outputs:
            matrix: ${{ steps.check.outputs.matrix }}
            minors: ${{ steps.check.outputs.minors }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: check
              shell: bash
              env:
                  FORCE: ${{ github.event_name == 'push' || inputs.force }}
              run: |
                  set -euo pipefail
                  : > minors.json
                  for MINOR in $(jq -r 'keys[]' versions.json); do
                      NEWEST=$(git ls-remote --tags --refs https://github.com/php/php-src.git "refs/tags/php-$MINOR.*" \
                          | sed -n -E 's|.*refs/tags/php-([0-9]+\.[0-9]+\.[0-9]+)$|\1|p' | sort -V | tail -n 1)
                      [ -n "$NEWEST" ] || { echo "::error::no stable php-src tag for PHP $MINOR"; exit 1; }
                      # The merge job moves <minor>-nts last.
                      INDEX=$(docker buildx imagetools inspect --raw "$PHP_IMAGE:$MINOR-nts" || true)
                      HAVE=$(jq -r '.annotations["org.opencontainers.image.version"] // empty' <<< "$INDEX")
                      CREATED=$(jq -r '.annotations["org.opencontainers.image.created"] // empty' <<< "$INDEX")
                      echo "PHP $MINOR: image has '$HAVE', built '$CREATED'; php-src has $NEWEST"
                      if [ "$FORCE" = true ] || [ -z "$HAVE" ] \
                          || [ "$(printf '%s\n' "$HAVE" "$NEWEST" | sort -V | tail -n 1)" != "$HAVE" ] \
                          || [ $(( $(date +%s) - $(date -d "$CREATED" +%s) )) -ge 604800 ]; then
                          jq -cn --arg php "$MINOR" --arg version "$NEWEST" '{php: $php, version: $version}' >> minors.json
                      fi
                  done
                  {
                      echo "minors=$(jq -cs . minors.json)"
                      # One build for each variant of each selected minor.
                      echo "matrix=$(jq -cs --slurpfile v versions.json \
                          '[.[] as $m | $v[0][$m.php].variants[] | split("/") as [$suite, $variant] | $m + {suite: $suite, variant: $variant}]' minors.json)"
                  } >> "$GITHUB_OUTPUT"

    php-build:
        needs: php-check
        if: needs.php-check.outputs.matrix != '[]'
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                image: ${{ fromJSON(needs.php-check.outputs.matrix) }}
                arch: [amd64, arm64]
                include:
                    - { arch: amd64, runner: ubuntu-26.04 }
                    - { arch: arm64, runner: ubuntu-26.04-arm }
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: ${{ matrix.image.php }}/${{ matrix.image.suite }}/${{ matrix.image.variant }}/Dockerfile
                  build-args: PHP_VERSION=${{ matrix.image.version }}
                  # A build without the cache also installs the newest packages of the suite.
                  no-cache: true
                  outputs: type=image,name=${{ env.PHP_IMAGE }},push-by-digest=true,name-canonical=true,push=true
            # push-by-digest pushes the image without a tag, so the merge takes only the digests of this run:
            # https://docs.docker.com/build/exporters/image-registry/#synopsis
            - shell: bash
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: echo "$DIGEST" > digest
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: digest-${{ matrix.image.php }}-${{ matrix.image.suite }}-${{ matrix.image.variant }}-${{ matrix.arch }}
                  path: digest
                  retention-days: 1

    php-merge:
        needs: [php-check, php-build]
        # A failed build of one minor must not hold back the tags of the other minors.
        if: ${{ !cancelled() && needs.php-build.result != 'skipped' }}
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                image: ${{ fromJSON(needs.php-check.outputs.minors) }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: digest-${{ matrix.image.php }}-*
                  path: digests
            - shell: bash
              env:
                  MINOR: ${{ matrix.image.php }}
                  VERSION: ${{ matrix.image.version }}
              run: |
                  set -euo pipefail
                  # php-check reads the annotations of <minor>-nts, so that tag moves last:
                  # versions.json lists trixie/nts first, and this loop walks the list in reverse order.
                  # A failed build has no digest file, so cat stops the merge before <minor>-nts moves.
                  for DIR in $(jq -r --arg m "$MINOR" '.[$m].variants | reverse[]' versions.json); do
                      SUITE=${DIR%/*}
                      VARIANT=${DIR#*/}
                      AMD64=$(cat "digests/digest-$MINOR-$SUITE-$VARIANT-amd64/digest")
                      ARM64=$(cat "digests/digest-$MINOR-$SUITE-$VARIANT-arm64/digest")
                      TAGS=(-t "$PHP_IMAGE:$VERSION-$SUITE-$VARIANT" -t "$PHP_IMAGE:$MINOR-$SUITE-$VARIANT")
                      # trixie is the default suite, as in the official image.
                      [ "$SUITE" != trixie ] || TAGS+=(-t "$PHP_IMAGE:$VERSION-$VARIANT" -t "$PHP_IMAGE:$MINOR-$VARIANT")
                      docker buildx imagetools create "${TAGS[@]}" \
                        --annotation "index:org.opencontainers.image.version=$VERSION" \
                        --annotation "index:org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                        "$PHP_IMAGE@$AMD64" "$PHP_IMAGE@$ARM64"
                  done
